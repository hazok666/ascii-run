// ---------- canvas / glyph atlas ----------
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let DPR = 1, W = 0, H = 0, CH = 10, CW = 6, ROWS = 32, COLS = 100;
// ROWS is the world's height. VROWS is how many rows fit on screen: wide, short screens (an iPhone with
// Safari's bars) zoom in, so the play area is never wider than TARGET_COLS. The world is bottom-anchored
// and only sky gets cropped. Each screen state also needs a minimum number of rows for its layout.
const TARGET_COLS = 100;
const NEED_ROWS = { mission: 26, title: 22, credits: 22, play: 19, win: 19, over: 19, paused: 19 };
let VROWS = 32, OY = 0, scaleKey = '';
const FIRST = 32, LAST = 126, NG = LAST - FIRST + 1;
let atlas = null, fontsReady = false;

function buildAtlas() {
  atlas = document.createElement('canvas');
  const cw = Math.ceil(CW), ch = Math.ceil(CH);
  atlas.width = cw * NG; atlas.height = ch * 4;
  const a = atlas.getContext('2d');
  const fs = Math.floor(CH * 0.82);
  a.textAlign = 'center'; a.textBaseline = 'middle';
  for (let row = 0; row < 4; row++) {
    const bold = row & 1, inv = row >> 1;
    a.font = `${bold ? 700 : 400} ${fs}px LG, ui-monospace, Menlo, monospace`;
    for (let i = 0; i < NG; i++) {
      if (inv) { a.fillStyle = '#fff'; a.fillRect(i * cw, row * ch, cw, ch); }
      a.fillStyle = inv ? '#000' : '#fff';
      a.fillText(String.fromCharCode(FIRST + i), i * cw + cw / 2, row * ch + ch / 2 + CH * 0.04);
    }
  }
}

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 3);
  W = Math.floor(window.innerWidth * DPR);
  H = Math.floor(window.innerHeight * DPR);
  cv.width = W; cv.height = H;
  scaleKey = '';
  applyScale();
}
function applyScale() {
  const need = NEED_ROWS[state] || 22;
  const key = need + ':' + W + 'x' + H;
  if (key === scaleKey) return;
  scaleKey = key;
  CH = Math.max(H / ROWS, W / (TARGET_COLS * 0.6));
  CH = Math.min(CH, H / need);
  CW = CH * 0.6;
  COLS = Math.ceil(W / CW);
  VROWS = Math.floor(H / CH + 0.001);
  OY = Math.max(0, ROWS * CH - H);
  if (fontsReady) buildAtlas();
}
window.addEventListener('resize', resize);

// draw one glyph at pixel position. mode: 0 normal, 1 bold, 2 inverted, 3 inverted bold
function glyph(code, px, py, mode) {
  if (code <= 32 || code > LAST) return;
  const cw = Math.ceil(CW), ch = Math.ceil(CH);
  ctx.drawImage(atlas, (code - FIRST) * cw, (mode | 0) * ch, cw, ch, Math.round(px), Math.round(py), cw, ch);
}
// draw string; opaque = black out each non-space cell first
function text(str, px, py, mode, opaque) {
  for (let i = 0; i < str.length; i++) {
    const c = str.charCodeAt(i);
    if (c === 32) continue;
    if (opaque) { ctx.fillStyle = '#000'; ctx.fillRect(Math.round(px + i * CW), Math.round(py), Math.ceil(CW) + 1, Math.ceil(CH) + 1); }
    glyph(c, px + i * CW, py, mode);
  }
}
// grid helpers (screen cells)
function gtext(str, col, row, mode, opaque) { text(str, col * CW, row * CH, mode, opaque); }
function gfill(col, row, w, h) { ctx.fillStyle = '#000'; ctx.fillRect(Math.round(col * CW), Math.round(row * CH), Math.ceil(w * CW), Math.ceil(h * CH)); }
function gbox(col, row, w, h, mode) {
  gfill(col, row, w, h);
  gtext('+' + '-'.repeat(w - 2) + '+', col, row, mode);
  for (let r = 1; r < h - 1; r++) { gtext('|', col, row + r, mode); gtext('|', col + w - 1, row + r, mode); }
  gtext('+' + '-'.repeat(w - 2) + '+', col, row + h - 1, mode);
}
function center(str) { return Math.floor((COLS - str.length) / 2); }

// ---------- deterministic noise ----------
function hash(x, y) {
  let h = (x | 0) * 374761393 + (y | 0) * 668265263;
  h = (h ^ (h >>> 13)) * 1274126177;
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function pick(set, x, y) { return set.charCodeAt(Math.floor(hash(x, y) * set.length)); }

    watch: 'WATCH FOR:  |_|_|  /\\/\\/\\  <o~^~-  /\\o/\\',
    art: [

const RADIO_TEXT = {
  s1_1: 'Can you hear me? You are inside the machine.',
  s1_2: 'The old drive is being erased. Run east. Do not stop.',
  s1_3: 'Find the letters. They spell the way out.',
};
let sectorIdx = 0;

function mulberry(seed) {
  return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let q = Math.imul(seed ^ seed >>> 15, 1 | seed); q = q + Math.imul(q ^ q >>> 7, 61 | q) ^ q; return ((q ^ q >>> 14) >>> 0) / 4294967296; };
}

function buildLevel() {
  const sec = SECTORS[sectorIdx];
  const rnd = mulberry(sec.seed);
  const TEMPLE_X = sec.len, IDOL_X = TEMPLE_X + 18, LEN = TEMPLE_X + 140;
  const h = new Array(LEN).fill(0), lock = new Array(LEN).fill(false);
  for (let x = 0; x < LEN; x++) {
    h[x] = Math.round(BASE_ROW + 2.4 * Math.sin(x / 23) + 1.4 * Math.sin(x / 9.7 + 1) + 1.2 * Math.sin(x / 71 + 3));
  }
  const flat = (a, b, row) => { for (let x = Math.max(0, a); x <= Math.min(LEN - 1, b); x++) { h[x] = row; lock[x] = true; } };

  // fixed beats: letters, hearts and auto-fire sit at set fractions of the level
  const L = TEMPLE_X;
  const special = [];
  const word = sec.word;
  const letterAt = [0.2, 0.43, 0.66, 0.9];
  letterAt.forEach((f, i) => special.push({ x: Math.round(L * f), kind: 'letter', i, style: ['pit', 'high', 'ground', 'snake'][i] }));
  [0.37, 0.76].forEach(f => special.push({ x: Math.round(L * f), kind: 'heart' }));
  [0.3, 0.6].forEach(f => special.push({ x: Math.round(L * f), kind: 'auto' }));
  const nearSpecial = x => special.some(s => Math.abs(s.x - x) < 26);

  // generated events, harder further in
  const ev = [];
  let x = 70;
  while (x < TEMPLE_X - 40) {
    if (nearSpecial(x)) { x += 6; continue; }
    const d = x / TEMPLE_X;
    const r = rnd();
    const table = d < 0.15
      ? [['cactus', 3], ['snake', 2], ['gems', 2], ['spikes', 1], ['pit', 2]]
      : [['cactus', 3], ['snake', 3], ['bat', 3], ['spikes', 2], ['pit', 3], ['gems', 1],
         ['cactusSnake', 2 * d], ['batPair', 2 * d], ['pitBat', 2 * d], ['spikes2', 1.5 * d], ['highGems', 1]];
    const sum = table.reduce((a, b) => a + b[1], 0);
    let k = r * sum, pick = table[0][0];
    for (const [n, wgt] of table) { if ((k -= wgt) <= 0) { pick = n; break; } }
    let extra = 0;
    if (pick === 'pit') ev.push([x, 'pit', 4 + Math.floor(rnd() * (2 + d * 3))]);
    else if (pick === 'cactusSnake') { ev.push([x, 'cactus'], [x + 14, 'snake']); extra = 14; }
    else if (pick === 'batPair') { ev.push([x, 'bat'], [x + 10, 'bat']); extra = 10; }
    else if (pick === 'pitBat') { ev.push([x, 'pit', 5], [x + 16, 'bat']); extra = 16; }
    else if (pick === 'spikes2') { ev.push([x, 'spikes'], [x + 12, 'spikes']); extra = 12; }
    else ev.push([x, pick]);
    const gap = d < 0.15 ? 30 + rnd() * 14 : 22 - d * 4 + rnd() * 12;
    x += gap + extra;
  }
  // fixed beats become events too
  for (const s of special) {
    if (s.kind === 'letter' && s.style === 'pit') ev.push([s.x - 3, 'pit', 6]);
    if (s.kind === 'letter' && s.style === 'snake') ev.push([s.x + 6, 'snake']);
  }

  flat(0, 40, BASE_ROW);
  flat(TEMPLE_X - 6, LEN - 1, BASE_ROW);

  const objs = [];
  for (const [x, t, w] of ev) {
    if (t === 'pit') {
      const row = h[x - 5];
      flat(x - 5, x - 1, row); flat(x + w, x + w + 4, row);
      for (let i = x; i < x + w; i++) { h[i] = NONE; lock[i] = true; }
      for (let i = 0; i < 4; i++) {
        const gx = x - 2 + i * (w + 3) / 3;
        const t01 = i / 3, arc = 4 * t01 * (1 - t01);
        objs.push({ t: 'gem', x: gx, top: row - 5 - Math.round(arc * 3) });
      }
    } else if (t === 'cactus' || t === 'spikes') {
      flat(x - 2, x + 7, h[x - 2]);
    }
  }
  for (const s of special) {
    if (s.kind === 'letter' && s.style === 'pit') continue;            // that one sits over its own pit
    let row = h[s.x - 4]; if (row === NONE) row = h[s.x + 5]; if (row === NONE) row = BASE_ROW;
    flat(s.style === 'high' ? s.x - 18 : s.x - 3, s.x + 4, row);   // long flat run-up so the high letter really needs the double jump
  }
  // keep slope steps <= 1 (forward then backward, unlocked cols only)
  for (let pass = 0; pass < 2; pass++) {
    for (let x = 1; x < LEN; x++) {
      if (lock[x] || h[x] === NONE || h[x - 1] === NONE) continue;
      if (h[x] > h[x - 1] + 1) h[x] = h[x - 1] + 1; else if (h[x] < h[x - 1] - 1) h[x] = h[x - 1] - 1;
    }
    for (let x = LEN - 2; x >= 0; x--) {
      if (lock[x] || h[x] === NONE || h[x + 1] === NONE) continue;
      if (h[x] > h[x + 1] + 1) h[x] = h[x + 1] + 1; else if (h[x] < h[x + 1] - 1) h[x] = h[x + 1] - 1;
    }
  }
  const surf = x => { x = Math.floor(x); return (x < 0 || x >= LEN) ? BASE_ROW : h[x]; };
  const ground = x => { let s = surf(x), k = 1; while (s === NONE) s = Math.min(surf(x - k), surf(x + k++)); return s; };

  for (const [x, t] of ev) {
    if (t === 'cactus') objs.push({ t, x, top: surf(x) - 2, w: 5, h: 2, hazard: true });
    if (t === 'spikes') objs.push({ t, x, top: surf(x) - 1, w: 6, h: 1, hazard: true });
    if (t === 'snake') objs.push({ t, x, top: surf(x) - 1, w: 6, h: 1, hazard: true, enemy: true, vx: -3 });
    if (t === 'bat') objs.push({ t, x, base: surf(x) - 3.2, top: 0, w: 5, h: 1, hazard: true, enemy: true, vx: -4, ph: x });
    if (t === 'gems') for (let i = 0; i < 4; i++) objs.push({ t: 'gem', x: x + i * 3, top: surf(x + i * 3) - 3 });
    if (t === 'highGems') for (let i = 0; i < 4; i++) objs.push({ t: 'gem', x: x + i * 3, top: ground(x + i * 3) - 8 });   // double-jump height
  }
  for (const s of special) {
    if (s.kind === 'heart') objs.push({ t: 'heart', x: s.x, top: surf(s.x) - 3, w: 2, h: 1 });
    if (s.kind === 'auto') objs.push({ t: 'auto', x: s.x, top: surf(s.x) - 3, w: 3, h: 1 });
    if (s.kind === 'letter') {
      const g = ground(s.x);
      const top = s.style === 'pit' ? g - 7 : s.style === 'high' ? g - 11 : g - 3;   // 'high' needs the double jump
      objs.push({ t: 'letter', ch: word[s.i], i: s.i, x: s.x, top, w: 3, h: 1 });
    }
  }
  for (const o of objs) if (o.t === 'gem') { o.w = 2; o.h = 1; }
  const idol = { t: 'idol', x: IDOL_X, top: BASE_ROW - 4, w: 5, h: 4 };
  objs.push(idol);
  level = { LEN, h, surf, objs, TEMPLE_X, IDOL_X, idol, sec };
}

const BASS4 = bars(...ROOTS.map(([r, o, f]) => `${r} . ${r} . ${o} . ${r} . ${r} . ${o} . ${r} . ${f} .`));
const ARP4 = bars('A4 C5 E5 C5 A4 C5 E5 C5 A4 C5 E5 C5 A4 C5 E5 A5', 'F4 A4 C5 A4 F4 A4 C5 A4 F4 A4 C5 A4 F4 A4 C5 F5',
                  'G4 B4 D5 B4 G4 B4 D5 B4 G4 B4 D5 B4 G4 B4 D5 G5', 'E4 G#4 B4 G#4 E4 G#4 B4 G#4 E4 G#4 B4 G#4 E4 G#4 B4 E5');
const REST4 = bars(...Array(64).fill('-'));
const DRUM1 = 'k-h-s-h-k-k-s-hh';
const SONGS = {
  level: {
    bpm: 152,
    ch: [
      { type: 'p25', vol: 0.085, notes: [...A_LEAD, ...A_LEAD, ...B_LEAD, ...A_LEAD] },
      { type: 'triangle', vol: 0.22, notes: [...BASS4, ...BASS4, ...BASS4, ...BASS4] },
      { type: 'p12', vol: 0.035, notes: [...REST4, ...REST4, ...ARP4, ...ARP4] },
    ],
    drums: (DRUM1.repeat(15) + 'k-h-s-s-k-s-ssss').split(''),
  },
  mission: {   // sparse and low so the radio voice sits on top
    bpm: 96,
    ch: [
      { type: 'p12', vol: 0.05, notes: bars('A4 - E5 - A5 - E5 - C5 - E5 - A5 - E5 -', 'A4 - E5 - A5 - E5 - C5 - E5 - B5 - E5 -',
                                             'F4 - C5 - F5 - C5 - A4 - C5 - F5 - C5 -', 'E4 - B4 - E5 - B4 - G#4 - B4 - E5 - B4 -') },
      { type: 'triangle', vol: 0.2, notes: bars('A2 . . . . . . . . . . . . . . .', 'A2 . . . . . . . . . . . . . . .',
                                                'F2 . . . . . . . . . . . . . . .', 'E2 . . . . . . . . . . . . . . .') },
    ],
    drums: ('h-------h---h---').repeat(4).split(''),
  },
};
const JINGLES = {
  win:  { bpm: 200, notes: bars('C5 E5 G5 C6 . . G5 C6 . . . . . . . .') },
  over: { bpm: 140, notes: bars('E5 . D5 . C5 . B4 . . . A4 . . . . . .') },
};
function playSong(name) {
  if (!AU.ctx) { AU.song = name; return; }
  if (AU.song === name && name) return;
  AU.song = name; AU.songStep = 0; AU.nextT = AU.ctx.currentTime + 0.06;
}
function musicTick() {
  const c = AU.ctx; if (!c || !AU.song) return;
  const S = SONGS[AU.song], st = 60 / S.bpm / 4, len = S.ch[0].notes.length;
  if (AU.nextT < c.currentTime - 0.2) AU.nextT = c.currentTime + 0.05;
  while (AU.nextT < c.currentTime + 0.15) {
    const i = AU.songStep % len, tt = AU.nextT;
    for (const ch of S.ch) {
      const n = ch.notes[i % ch.notes.length];
      if (n === '.' || n === '-') continue;
      let k = 1; while (ch.notes[(i + k) % ch.notes.length] === '.' && k < 16) k++;
      tone(ch.type, hz(n), tt, k * st * 0.95, ch.vol, AU.music);
    }
    const d = S.drums[i % S.drums.length];
    if (d === 'k') kick(tt, 0.45, AU.music);
    if (d === 's') noiseHit(tt, 0.12, 0.16, 1200, AU.music);
    if (d === 'h') noiseHit(tt, 0.03, 0.05, 7000, AU.music);
    AU.songStep++; AU.nextT += st;
  }
}
function jingle(name) {
  if (!AU.ctx) return;
  playSong(null);
  const J = JINGLES[name], st = 60 / J.bpm / 4, t0 = AU.ctx.currentTime + 0.05;
  J.notes.forEach((n, i) => {
    if (n === '.' || n === '-') return;
    let k = 1; while (J.notes[i + k] === '.') k++;
    tone('p25', hz(n), t0 + i * st, k * st, 0.1, AU.music);
    tone('triangle', hz(n) / 2, t0 + i * st, k * st, 0.15, AU.music);
  });
}

// voice queue + autoduck: music drops while the radio talks, then swells back
function duck(t0, t1) {
  const g = AU.music.gain;
  g.cancelScheduledValues(t0);
  g.setTargetAtTime(0.22, t0 - 0.05, 0.05);
  g.setTargetAtTime(1, t1 + 0.1, 0.35);
}
function stopVoice() {
  if (!AU.ctx) return;
  for (const s of AU.voiceSrc) { try { s.stop(); } catch (e) {} }
  AU.voiceSrc = [];
  const g = AU.music.gain; g.cancelScheduledValues(AU.ctx.currentTime); g.setTargetAtTime(1, AU.ctx.currentTime, 0.2);
}
// schedule lines back to back; returns [{key, start, dur}] in seconds from now
function sayLines(keys, delay, gap) {
  const out = [];
  if (!AU.ctx) return out;
  stopVoice();
  let tt = AU.ctx.currentTime + (delay || 0);
  const first = tt;
  for (const k of keys) {
    const b = AU.buf[k];
    const dur = b ? b.duration : 2.5;
    if (b) {
      const s = AU.ctx.createBufferSource(); s.buffer = b; s.connect(AU.voice); s.start(tt);
      AU.voiceSrc.push(s);
    }
    out.push({ key: k, start: tt - AU.ctx.currentTime, dur });
    tt += dur + (gap || 0.35);
  }
  if (out.length) duck(first, tt - (gap || 0.35));
  return out;
}

const SFX = {
  jump()   { tone('p25', 330, now(), 0.09, 0.09, null, 700); },
  jump2()  { tone('p25', 520, now(), 0.1, 0.09, null, 1100); },
  throw()  { tone('p12', 900, now(), 0.05, 0.06, null, 500); },
  pop()    { noiseHit(now(), 0.12, 0.22, 2500); tone('square', 220, now(), 0.08, 0.06, null, 90); },
  hit()    { noiseHit(now(), 0.3, 0.35, 300); tone('square', 160, now(), 0.25, 0.1, null, 50); },
  gem()    { tone('p25', 1320, now(), 0.05, 0.06); tone('p25', 1760, now() + 0.05, 0.08, 0.06); },
  heart()  { ['C5', 'E5', 'G5', 'C6'].forEach((n, i) => tone('p25', hz(n), now() + i * 0.05, 0.07, 0.08)); },
  letter() { ['A5', 'C#6', 'E6', 'A6'].forEach((n, i) => tone('p12', hz(n), now() + i * 0.06, 0.12, 0.09)); },
  auto()   { ['E5', 'E6', 'E5', 'E6'].forEach((n, i) => tone('square', hz(n), now() + i * 0.04, 0.04, 0.05)); },
  tick()   { tone('square', 1800 + Math.random() * 400, now(), 0.012, 0.02); },
  select() { tone('p25', 880, now(), 0.05, 0.07); },
};
function now() { return AU.ctx.currentTime + 0.005; }
function sfx(name) { if (AU.ctx && AU.on) SFX[name](); }

// ---------- game state ----------
const PCOL = 16;          // player screen column
const SPEED = 23;         // cells / s
const GRAV = 115;         // rows / s^2 while rising
const GRAV_FALL = 165;    // heavier on the way down: snappier, less floaty
const JUMP_V = 36.5;      // rows / s
const TAP_V = 27;         // a quick tap is capped here (still clears cacti)
const AIR_JUMP_V = 31;    // second jump in the air
const BULLET_V = 62;
const AUTO_TIME = 4;      // seconds of auto-fire from a [*] pickup
const MAX_HP = 3;
const STEP = 1 / 60;

let state = 'title';      // title | credits | mission | play | over | win | paused
let mission = null;
let menuSel = 0;
let swapButtons = false;
try { swapButtons = localStorage.getItem('lg_swap') === '1'; } catch (e) {}
let t = 0, camX = 0, flash = 0, shake = 0;
const P = { airJumps: 1, flip: 0, auto: 0, y: BASE_ROW, vy: 0, ground: true, coyote: 0, buffer: 0, cool: 0, shootAnim: 0, inv: 0, lives: 3, gems: 0, kills: 0, anim: 0 };
let bullets = [], parts = [];
let runTime = 0;
const input = { jump: false, shoot: false, jumpPressed: false, shootPressed: false };

function newRun() {
  buildLevel();
  camX = 0; t = 0; runTime = 0;
  Object.assign(P, { airJumps: 1, flip: 0, auto: 0, y: BASE_ROW, vy: 0, ground: true, coyote: 0, buffer: 0, cool: 0, shootAnim: 0, inv: 0, lives: 3, gems: 0, kills: 0, anim: 0 });
  P.letters = level.sec.word.split('').map(() => false); P.hits = 0;
  bullets = []; parts = [];
  state = 'play';
  stopVoice(); playSong('level');
}

// ---------- mission screen (before each sector) ----------
function startMission() {
  const sec = SECTORS[sectorIdx];
  buildLevel(); camX = 0;
  state = 'mission';
  mission = { t: 0, lines: [], ready: false, skipped: false, end: 99, ticks: 0 };
  playSong('mission');
  const go = () => {
    const lines = [];
    sec.status.forEach((txt, i) => lines.push({ kind: 'status', text: txt, start: 0.2 + i * 0.45, dur: 0.4 }));
    const vt = sayLines(sec.radio, 1.7, 0.35);
    let tEnd = 1.7;
    sec.radio.forEach((k, i) => {
      const txt = RADIO_TEXT[k];
      const v = vt[i] || { start: tEnd, dur: txt.length / 22 };
      lines.push({ kind: 'radio', text: txt, start: v.start, dur: v.dur * 0.92 });
      tEnd = v.start + v.dur + 0.35;
    });
    lines.push({ kind: 'mission', text: 'MISSION:  FIND THE LETTERS   ' + sec.word.split('').map(() => '_').join(' '), start: tEnd, dur: 0.7 });
    lines.push({ kind: 'watch', text: sec.watch, start: tEnd + 0.5, dur: 0.6 });
    mission.lines = lines; mission.end = tEnd + 1.3; mission.t = 0; mission.ready = true;
  };
  if (AU.ready) AU.ready.then(go); else go();
}
function missionDone() { return mission.skipped || mission.t >= mission.end; }
function missionTap() {
  if (!mission.ready) return;
  if (!missionDone()) { mission.skipped = true; stopVoice(); sfx('select'); return; }
  sfx('select'); newRun();
}
function shown(l) {
  if (mission.skipped) return l.text.length;
  return Math.max(0, Math.min(l.text.length, Math.floor((mission.t - l.start) / l.dur * l.text.length)));
}

function onWin() {
  state = 'win'; menuSel = 0;
  const all = P.letters.every(Boolean);
  P.stars = [true, all, P.hits === 0];
  try {
    const key = 'ar_stars_' + level.sec.id, old = +(localStorage.getItem(key) || 0);
    localStorage.setItem(key, old | P.stars.reduce((a, b, i) => a | (b ? 1 << i : 0), 0));
  } catch (e) {}
  jingle('win');
  sayLines(all ? ['win', 'allletters'] : ['win'], 1.0, 0.3);
}
function onOver() {
  state = 'over'; menuSel = 0;
  jingle('over');
  sayLines(['over'], 0.9, 0.3);
}
function toTitle() {
  buildLevel(); state = 'title'; menuSel = 0; camX = 0;
  stopVoice(); playSong('mission');
}

function px() { return camX + PCOL; }
function feetSurf() {
  const x = px();
  let s = NONE;
  for (let i = 2; i <= 4; i++) s = Math.min(s, level.surf(x + i));
  return s;
}
function overlap(ax, ay, aw, ah, bx, by, bw, bh) { return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by; }

function burst(str, x, y, n) {
  for (let i = 0; i < n; i++) {
    const ch = str.replace(/ /g, '')[i % Math.max(1, str.replace(/ /g, '').length)] || '*';
    parts.push({ x, y, vx: (Math.random() - 0.3) * 18, vy: -Math.random() * 16 - 4, ch, life: 0.8 + Math.random() * 0.5 });
  }
}
function vibrate(ms) { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} }

const hurtLog = [];
function hurt(kind, by) {
  if (P.inv > 0 && kind !== 'fall') return;
  hurtLog.push([kind, by || '', Math.round(px())]);
  P.lives--; P.hits++; flash = 0.12; shake = 0.25; vibrate(80); sfx('hit');
  burst('*#+', px() + 2, P.y - 2, 10);
  if (P.lives <= 0) { onOver(); return; }
  P.inv = 1.6;
  if (kind === 'fall') {
    // respawn ~1 s before the pit edge
    let x = Math.floor(px() + 2);
    while (x > 0 && level.surf(x) === NONE) x--;
    while (x > 0 && level.surf(x) !== NONE && level.surf(x - 1) !== NONE && level.surf(x) === level.surf(x - 1) && x > Math.floor(px() + 2) - 4) x--;
    camX = Math.max(0, x - 18 - PCOL);
    P.y = feetSurf(); if (P.y === NONE) P.y = BASE_ROW;
    P.vy = 0; P.ground = true;
  }
}

function update(dt) {
  t += dt;
  if (flash > 0) flash -= dt;
  if (shake > 0) shake -= dt;
  for (const p of parts) { p.vy += 40 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
  parts = parts.filter(p => p.life > 0);

  if (state === 'title' || state === 'credits') { camX = (camX + 4 * dt) % (level.TEMPLE_X - 60); return; }
  if (state === 'mission') {
    if (!mission.ready) return;
    mission.t += dt;
    // typewriter ticks on the system lines (the radio lines have the voice instead)
    let n = 0;
    for (const l of mission.lines) if (l.kind !== 'radio') n += shown(l);
    if (n > mission.ticks) { if (n % 2 === 0) sfx('tick'); mission.ticks = n; }
    return;
  }
  if (state !== 'play') { input.jumpPressed = input.shootPressed = false; return; }

  runTime += dt;
  camX += SPEED * dt;
  const X = px();

  // jump with coyote time, buffer and variable height
  if (input.jumpPressed) P.buffer = 0.12;
  P.buffer -= dt; P.coyote -= dt;
  if (P.ground) P.coyote = 0.09;
  if (P.ground) P.airJumps = 1;
  if (P.buffer > 0 && P.coyote > 0) { P.vy = -JUMP_V; P.ground = false; P.coyote = 0; P.buffer = 0; sfx('jump'); }
  else if (P.buffer > 0 && !P.ground && P.airJumps > 0) {          // double jump
    P.vy = -AIR_JUMP_V; P.airJumps--; P.buffer = 0; P.flip = 0.22; sfx('jump2');
    for (let i = 0; i < 5; i++) parts.push({ x: X + 2 + Math.random() * 2, y: P.y, vx: (Math.random() - 0.5) * 10, vy: 4 + Math.random() * 6, ch: "'.'-."[i], life: 0.35 });
  }
  P.flip -= dt;
  if (!input.jump && P.vy < -TAP_V) P.vy = -TAP_V;   // a tap still clears rocks; holding goes higher

  P.vy += (P.vy < 0 ? GRAV : GRAV_FALL) * dt;
  P.y += P.vy * dt;
  const s = feetSurf();
  if (s !== NONE && P.y > s + 1.8) { hurt('fall'); return; }          // fell into a pit and hit its far wall
  if (s !== NONE && P.y > s && P.vy >= 0) { P.y = s; P.vy = 0; P.ground = true; }   // landed on a rising slope
  if (P.vy >= 0 && s !== NONE && P.y >= s) { P.y = s; P.vy = 0; P.ground = true; }
  else if (P.ground && s !== NONE && s < P.y && s >= P.y - 1.01) { P.y = s; }   // walk up a slope step
  else if (P.ground && s !== NONE && s > P.y && s <= P.y + 1.01) { P.y = s; }   // walk down a slope step
  else P.ground = false;
  if (P.y > ROWS + 4) { hurt('fall'); return; }

  // shoot
  P.cool -= dt; P.shootAnim -= dt;
  if (P.auto > 0) P.auto -= dt;
  if ((input.shootPressed || input.shoot || P.auto > 0) && P.cool <= 0) {
    bullets.push({ x: X + 6, y: P.y - 2 + (P.auto > 0 ? (Math.random() - 0.5) * 0.6 : 0), d: 0 });
    P.cool = P.auto > 0 ? 0.08 : (input.shootPressed ? 0.14 : 0.2);   // hold = repeat, pickup = rapid auto-fire
    P.shootAnim = 0.12;
    if (P.auto <= 0 || Math.random() < 0.5) sfx('throw');
  }
  input.jumpPressed = input.shootPressed = false;

  for (const b of bullets) { b.x += BULLET_V * dt; b.d += BULLET_V * dt; }
  bullets = bullets.filter(b => b.d < COLS && level.surf(b.x) > b.y);

  // objects
  const pl = { x: X + 2, y: P.y - 3.8, w: 2.2, h: 3.6 };
  for (const o of level.objs) {
    if (o.dead) continue;
    if (o.x < camX - 10 || o.x > camX + COLS + 4) continue;
    if (o.enemy && o.x < camX + COLS) {
      o.x += o.vx * dt;
      if (o.t === 'snake') { const sv = level.surf(o.x + 1); if (sv !== NONE) o.top = sv - 1; }
      if (o.t === 'bat') o.top = o.base + Math.sin(t * 3 + o.ph) * 0.9;
    }
    if (o.enemy) {
      for (const b of bullets) {
        if (!b.hit && b.x + 1 > o.x && b.x < o.x + o.w && Math.abs((o.top + o.h / 2) - b.y) < 2.2) {
          b.hit = true; o.dead = true; P.kills++;
          burst(SPR[o.t][0].join(''), o.x + o.w / 2, o.top, 8); vibrate(20); sfx('pop');
        }
      }
    }
    if (o.dead) continue;
    const m = o.t === 'gem' || o.t === 'idol' || o.t === 'auto' || o.t === 'heart' || o.t === 'letter' ? -0.5 : 0.4;   // forgiving hazards, generous pickups
    if (overlap(pl.x, pl.y, pl.w, pl.h, o.x + m, o.top + m * 0.5, o.w - 2 * m, o.h - m * 0.5)) {
      if (o.t === 'letter') {
        o.dead = true; P.letters[o.i] = true; vibrate(40); sfx('letter');
        burst(o.ch.repeat(4) + '*+', o.x + 1, o.top, 10); P.letterFlash = 1;
      }
      else if (o.t === 'heart') {
        o.dead = true; vibrate(30); sfx('heart');
        if (P.lives < MAX_HP) { P.lives++; parts.push({ x: o.x, y: o.top, vx: 0, vy: -6, ch: '+', life: 0.6 }); }
        else { P.gems += 5; parts.push({ x: o.x, y: o.top, vx: 0, vy: -6, ch: '5', life: 0.6 }); }   // full health: bonus instead
      }
      else if (o.t === 'auto') { o.dead = true; P.auto = AUTO_TIME; vibrate(30); sfx('auto'); burst('*+*+', o.x + 1, o.top, 6); }
      else if (o.t === 'gem') { o.dead = true; P.gems++; sfx('gem'); parts.push({ x: o.x, y: o.top, vx: 0, vy: -6, ch: '+', life: 0.5 }); }
      else if (o.t === 'idol') { burst('$*<>+', o.x + 2, o.top, 24); vibrate(60); onWin(); }
      else if (o.hazard && P.inv <= 0) { hurt('hit', o.t); }
    }
  }
  bullets = bullets.filter(b => !b.hit);
  if (P.inv > 0) P.inv -= dt;
  P.anim += dt * (P.ground ? 11 : 0);
  if (P.letterFlash > 0) P.letterFlash -= dt;
}

// ---------- rendering ----------
function render() {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  if (!atlas) return;
  if (H > W) { drawRotate(); return; }
  applyScale();
  if (state === 'mission') { drawMission(); return; }

  ctx.save();
  ctx.translate(0, -OY);   // bottom-anchored world: only the sky is cropped
  if (shake > 0) ctx.translate((Math.random() - 0.5) * CW, (Math.random() - 0.5) * CH * 0.5);

  drawWorld();
  if (state === 'play' || state === 'over' || state === 'win' || state === 'paused') { drawObjects(); drawPlayer(); }
  for (const p of parts) glyph(p.ch.charCodeAt(0), (p.x - camX) * CW, p.y * CH, 1);
  ctx.restore();

  if (state === 'play' || state === 'paused') { drawHUD(); drawButtons(); }
  if (state === 'title') drawTitle();
  if (state === 'credits') drawCredits();
  if (state === 'over') drawEnd(OVER_ART, ['RETRY SECTOR', 'MENU']);
  if (state === 'win') drawEnd(WIN_ART, ['PLAY AGAIN', 'MENU']);
  if (state === 'paused') drawArtBox(PAUSE_ART, ['TAP TO RESUME']);

  if (flash > 0) { ctx.globalCompositeOperation = 'difference'; ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H); ctx.globalCompositeOperation = 'source-over'; }
}

const FAR = '.  .   .     \'    .        ';
function drawWorld() {
  const surfAtScreenPx = sx => level.surf(camX + sx / CW);

  // layer 1: stars (very slow)
  {
    const cx = camX * 0.08, off = (cx % 1) * CW;
    for (let c = -1; c <= COLS; c++) {
      const wx = Math.floor(cx) + c;
      for (let r = 2; r < 15; r++) {
        if (hash(wx, r * 7) < 0.012) {
          const sx = c * CW - off;
          glyph(hash(wx, r) < 0.8 ? 46 : 39, sx, r * CH, 0);
        }
      }
    }
  }
  // layer 2: distant ridge — outline plus sparse fill, like the reference image
  {
    const cx = camX * 0.35, off = (cx % 1) * CW;
    const m = x => Math.round(11 + 4 * Math.sin(x / 29) + 2.5 * Math.sin(x / 11.3 + 2) + 1.2 * Math.sin(x / 4.1));
    for (let c = -1; c <= COLS; c++) {
      const wx = Math.floor(cx) + c;
      const top = m(wx), sx = c * CW - off;
      const fg = surfAtScreenPx(sx + CW / 2);
      for (let r = top; r < ROWS; r++) {
        if (r >= fg || r > 21) break;
        let ch = 0;
        if (r === top) ch = m(wx - 1) > top ? 47 : (m(wx + 1) > top ? 92 : (hash(wx, r) < 0.5 ? 46 : 58));
        else {
          const d = r - top;
          if (hash(wx, r) < Math.max(0, 0.16 - d * 0.018)) ch = pick(".:.:'/\\.", wx, r + 99);
        }
        if (ch) glyph(ch, sx, r * CH, 0);
      }
    }
  }
  // temple facade (background, walk-through)
  {
    const tx = level.TEMPLE_X;
    const top = BASE_ROW - TEMPLE.length;
    const sx0 = (tx - camX) * CW;
    if (sx0 < W && sx0 + 40 * CW > 0) { ctx.fillStyle = '#000'; ctx.fillRect(sx0 + CW, top * CH, 38 * CW, TEMPLE.length * CH); }
    for (let r = 0; r < TEMPLE.length; r++) {
      const sx = sx0;
      if (sx > W || sx + TEMPLE[r].length * CW < 0) break;
      text(TEMPLE[r], sx, (top + r) * CH, 0, true);
    }
  }
  // foreground ground
  {
    const off = (camX % 1) * CW, c0 = Math.floor(camX);
    for (let c = -1; c <= COLS + 1; c++) {
      const wx = c0 + c, s = level.surf(wx);
      if (s === NONE) continue;
      const sx = c * CW - off;
      const l = level.surf(wx - 1), rr = level.surf(wx + 1);
      for (let r = s; r < ROWS; r++) {
        let ch;
        if (r === s) ch = l > s ? 47 : (rr > s ? 92 : 61);           // / \ =
        else if (l === NONE && r < s + 6) ch = 124;                   // cliff |
        else if (rr === NONE && r < s + 6) ch = 124;
        else if (r === s + 1) ch = pick('#X%#8', wx, r);
        else if (r <= s + 3) ch = pick(':=+*X#%0', wx, r);
        else ch = hash(wx, r + 5) < 0.4 ? pick(".:=+'", wx, r) : 0;
        let mode = r === s ? 1 : 0;
        if (r >= s + 2 && hash(wx * 13, r + 77) < FLICKER) {
          // this cell is a "light": it blinks on and off at its own rate
          const rate = 3 + hash(wx, r + 11) * 9, phase = Math.floor(t * rate + hash(wx, r + 3) * 10);
          const on = hash(wx * 7 + r, phase) > 0.45;
          if (!on) ch = 0;
          else if (!ch) { ch = pick(".'*+", wx, phase); mode = 1; }
          else if (hash(phase, wx) < 0.3) ch = pick('#X%*+0', wx + phase, r);
        }
        if (!ch) continue;
        glyph(ch, sx, r * CH, mode);
      }
    }
  }
}

function halo(sx, top, w, h) {
  ctx.fillStyle = '#000';
  ctx.fillRect(Math.round(sx - CW * 0.6), Math.round((top - 0.4) * CH), Math.ceil((w + 1.2) * CW), Math.ceil((h + 0.4) * CH));
}
function drawSprite(lines, wx, top, mode) {
  for (let r = 0; r < lines.length; r++) text(lines[r], (wx - camX) * CW, (top + r) * CH, mode, false);
}

function drawObjects() {
  for (const o of level.objs) {
    if (o.dead || o.x < camX - 10 || o.x > camX + COLS + 2) continue;
    if (o.t === 'gem' && Math.floor(t * 4 + o.x) % 4 === 0) { drawSprite(['><'], o.x, o.top, 1); continue; }
    if (o.t === 'letter') {   // a letter of the sector word: inverted cell in brackets, gently bobbing
      const sx = (o.x - camX) * CW, sy = (o.top + Math.sin(t * 4 + o.x) * 0.25) * CH;
      const br = Math.floor(t * 3) % 2 ? '[ ]' : '< >';
      text(br, sx, sy, 1, false);
      glyph(o.ch.charCodeAt(0), sx + CW, sy, 3);
      continue;
    }
    const frames = SPR[o.t];
    const f = frames[Math.floor(t * 6 + o.x) % frames.length];
    drawSprite(f, o.x, o.top, o.t === 'idol' ? 1 : 1);
  }
  for (const b of bullets) glyph(42, (b.x - camX) * CW, b.y * CH, 1);
}

function drawPlayer() {
  if (state === 'over') return;
  if (P.inv > 0 && Math.floor(t * 14) % 2 === 0) return;
  let spr = P.ground ? P_RUN[Math.floor(P.anim) % 4] : (P.flip > 0 ? P_FLIP : (P.vy < 0 ? P_JUMP : P_FALL));
  if (P.shootAnim > 0) spr = [spr[0], spr[1], SHOOT_ARMS, spr[3]];
  const top = P.y - 4;
  for (let r = 3; r >= 0; r--) {
    // the hat row is pulled down so the brim sits on the head instead of floating a row above it
    const dy = r === 0 ? (window.__hatDrop ?? HAT_DROP) : (r === 1 ? (window.__headDrop ?? HEAD_DROP) : 0);
    text(spr[r], PCOL * CW, (top + r + dy) * CH, 1, false);
  }
}

function pad(n, l) { return String(n).padStart(l, '0'); }
function drawHUD() {
  let lives = ''; for (let i = 0; i < MAX_HP; i++) lives += i < P.lives ? '[<3]' : '[  ]';   // health: 3 boxes
  gfill(1, 0, lives.length + 2, 1); gtext(lives, 2, 0, 1);
  if (P.auto > 0) {
    const k = Math.ceil(P.auto / AUTO_TIME * 10), a = 'AUTO [' + '#'.repeat(k) + '.'.repeat(10 - k) + ']';
    gfill(1, 1, a.length + 2, 1); gtext(a, 2, 1, Math.floor(t * 8) % 2 && P.auto < 1.5 ? 0 : 1);
  }
  {
    const w = level.sec.word.split('').map((c, i) => P.letters[i] ? c : '_').join(' ');
    const s = '[ ' + w + ' ]', col = center(s);
    gfill(col - 1, 1, s.length + 2, 1);
    gtext(s, col, 1, P.letterFlash > 0 && Math.floor(t * 12) % 2 ? 3 : 1);
  }
  const gems = '<> ' + pad(P.gems, 3);
  gfill(COLS - gems.length - 3, 0, gems.length + 2, 1); gtext(gems, COLS - gems.length - 2, 0, 1);
  const n = 24, p = Math.min(1, px() / level.IDOL_X), k = Math.floor(p * n);
  const bar = '[' + '='.repeat(k) + '>' + '.'.repeat(n - k) + '@]';
  gfill(center(bar) - 1, 0, bar.length + 2, 1); gtext(bar, center(bar), 0, 0);
}

function btnRects() {
  const w = 11, h = 5, row = VROWS - h - 1;
  const left = { col: 3, row, w, h }, right = { col: COLS - w - 3, row, w, h };
  return swapButtons ? { shoot: left, jump: right } : { jump: left, shoot: right };
}
function drawButton(r, icon, label, down) {
  const mode = down ? 2 : 0;
  gbox(r.col, r.row, r.w, r.h, 0);
  if (down) { ctx.fillStyle = '#fff'; ctx.fillRect(Math.round((r.col + 1) * CW), Math.round((r.row + 1) * CH), Math.ceil((r.w - 2) * CW), Math.ceil((r.h - 2) * CH)); }
  gtext(icon, r.col + Math.floor((r.w - icon.length) / 2), r.row + 1, down ? 3 : 1);
  gtext(label, r.col + Math.floor((r.w - label.length) / 2), r.row + 3, mode);
}
function drawButtons() {
  const b = btnRects();
  drawButton(b.jump, '/\\', 'JUMP', input.jump);
  drawButton(b.shoot, '-*', 'THROW', input.shoot);
}

function drawArt(art, row) {
  const w = Math.max(...art.map(s => s.length));
  const col = Math.floor((COLS - w) / 2);
  gfill(col - 2, row - 1, w + 4, art.length + 2);
  for (let i = 0; i < art.length; i++) gtext(art[i], col, row + i, 1);
  return row + art.length;
}
function drawMenu(items, row) {
  const sp = VROWS < 26 ? 1 : 2;              // single-spaced menus on short (zoomed) screens
  const w = Math.max(...items.map(s => s.length)) + 8;
  const col = Math.floor((COLS - w) / 2);
  const hgt = items.length * sp + (sp === 1 ? 2 : 1);
  gbox(col, row, w, hgt, 0);
  menuHit = [];
  items.forEach((it, i) => {
    const r = row + 1 + i * sp, sel = i === menuSel;
    gtext((sel ? '> ' : '  ') + it, col + 3, r, sel ? 1 : 0);
    menuHit.push({ row0: sp === 2 ? r - 1 : r, row1: r + 1, col0: col, col1: col + w, i });
  });
  return row + hgt;
}

// ---------- demoscene title: the logo waves, but every character stays upright and on the grid ----------
// The wave is quantized to whole cells: characters switch on/off one row up or down (and rows step one
// column sideways), like a text-mode demo. No sub-cell offsets, no tilting.
function drawWaveLogo(art, row) {
  const w = Math.max(...art.map(s => s.length));
  const col = Math.floor((COLS - w) / 2);
  gfill(col - 3, row - 2, w + 6, art.length + 4);
  for (let i = 0; i < art.length; i++) {
    const xo = 0;
    for (let j = 0; j < art[i].length; j++) {
      const c = art[i].charCodeAt(j);
      if (c === 32) continue;
      const yo = Math.round(Math.sin(j * 0.085 - t * 2.6) * 1.0);     // -1, 0, +1 rows: a long, slow swell so the letters stay readable
      glyph(c, (col + j + xo) * CW, (row + i + yo) * CH, 1);
    }
  }
  return row + art.length + 1;
}
const SCROLL_TEXT = '          *** ASCII RUN ***     THE MACHINE IS ERASING ITSELF ...     EVERY PIXEL IS A LETTER ...     ' +
  'FIND THE LETTERS, OUTRUN THE WORM ...     HOLD ON TO YOUR HAT ...     GREETINGS TO EVERYONE WHO EVER TYPED  LOAD"*",8,1     ' +
  '...     PRESS START     ';
// straight scroller that steps one whole cell at a time
function drawScroller(row) {
  gfill(0, row, COLS, 1);
  const step = Math.floor(t * 12), L = SCROLL_TEXT.length + COLS;
  const start = COLS - (step % L);
  for (let i = 0; i < SCROLL_TEXT.length; i++) {
    const cx = start + i;
    if (cx < 0 || cx >= COLS) continue;
    const c = SCROLL_TEXT.charCodeAt(i);
    if (c !== 32) glyph(c, cx * CW, row * CH, 1);
  }
}
let menuHit = [];
const FS_OK = !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
const IOS_BROWSER = /iPhone|iPod/.test(navigator.userAgent) && !navigator.standalone;
function isFull() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
function toggleFull() {
  const el = document.documentElement;
  if (isFull()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  else {
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    try {
      const pr = req.call(el, { navigationUI: 'hide' });
      if (pr && pr.then) pr.then(() => { try { screen.orientation.lock('landscape').catch(() => {}); } catch (e) {} }).catch(() => {});
    } catch (e) {}
  }
}
function titleMenu() {
  const m = [['start', 'START'], ['buttons', 'BUTTONS: ' + (swapButtons ? 'JUMP RIGHT' : 'JUMP LEFT')], ['sound', 'SOUND: ' + (AU.on ? 'ON' : 'OFF')]];
  if (FS_OK) m.push(['full', 'FULL SCREEN: ' + (isFull() ? 'ON' : 'OFF')]);
  m.push(['credits', 'CREDITS']);
  return m;
}
function titleItems() { return titleMenu().map(x => x[1]); }
function drawTitle() {
  const top = Math.max(1, Math.floor(VROWS * 0.08));
  let r = drawWaveLogo(TITLE_ART, top);
  // terminal prompt: RUN is a command
  const cmd = '> RUN' + (Math.floor(t * 2) % 2 ? '_' : ' ');
  gfill(center(cmd) - 1, r + 1, cmd.length + 2, 1); gtext(cmd, center(cmd), r + 1, 1);
  const sub = 'find the treasure';
  gfill(center(sub) - 1, r + 2, sub.length + 2, 1); gtext(sub, center(sub), r + 2, 0);
  drawMenu(titleItems(), r + 4);
  drawScroller(VROWS - 4);
  if (IOS_BROWSER) {   // iPhone Safari has no fullscreen API: the home-screen web app is the way
    const tip = 'FULL SCREEN: SHARE > ADD TO HOME SCREEN';
    gfill(2, VROWS - 2, tip.length + 2, 1); gtext(tip, 3, VROWS - 2, 0);
  }
  const v = GAME_VERSION;
  gfill(COLS - v.length - 3, VROWS - 2, v.length + 2, 1); gtext(v, COLS - v.length - 2, VROWS - 2, 0);
}
const CREDITS = [
  'ASCII RUN',
  '',
  'A GAME BY ERIC FALK',
  '',
  'NO IMAGES IN THIS GAME. EVERY PIXEL IS A LETTER.',
];
function drawCredits() {
  const w = Math.max(...CREDITS.map(s => s.length)) + 8, h = CREDITS.length + 4;
  const col = Math.floor((COLS - w) / 2), row = Math.max(1, Math.floor((VROWS - h) / 2) - 3);
  gbox(col, row, w, h, 0);
  CREDITS.forEach((s, i) => gtext(s, col + 4, row + 2 + i, i === 0 ? 1 : 0));
  menuSel = 0;
  drawMenu(['BACK'], row + h + 1);
}
function drawEnd(art, items) {
  const top = Math.max(1, Math.floor(VROWS * 0.06));
  let r = drawArt(art, top);
  const secs = runTime.toFixed(1);
  const stat = state === 'win'
    ? `GEMS ${pad(P.gems, 3)}   CREATURES ${pad(P.kills, 2)}   TIME ${secs}s`
    : `GEMS ${pad(P.gems, 3)}   DISTANCE ${Math.floor(Math.min(1, px() / level.IDOL_X) * 100)}%`;
  gfill(center(stat) - 2, r + 1, stat.length + 4, 1); gtext(stat, center(stat), r + 1, 0);
  if (state === 'win' && P.stars) {
    const word = level.sec.word.split('').map((c, i) => P.letters[i] ? c : '_').join(' ');
    const rows = [
      (P.stars[0] ? '[*]' : '[ ]') + ' SECTOR CLEARED',
      (P.stars[1] ? '[*]' : '[ ]') + ' ALL LETTERS     ' + word,
      (P.stars[2] ? '[*]' : '[ ]') + ' NO HITS',
    ];
    const w = Math.max(...rows.map(x => x.length)), col = center(' '.repeat(w));
    gfill(col - 2, r + 2, w + 4, 4);
    rows.forEach((x, i) => gtext(x, col, r + 3 + i, P.stars[i] ? 1 : 0));
    r += 5;
  }
  drawMenu(items, r + 3);
}
function drawMission() {
  const sec = level.sec;
  const c0 = 3, c1 = COLS - 4, w = c1 - c0;
  gbox(c0, 1, w, VROWS - 2, 0);
  const head = 'SECTOR ' + pad(sec.id, 2) + ' / 09';
  gtext(head, c0 + 4, 3, 1);
  gtext(sec.name, c1 - 4 - sec.name.length, 3, 1);
  gtext('-'.repeat(w - 6), c0 + 3, 4, 0);
  // narrow screens (iPad 4:3) drop the picture so the status lines fit
  const roomy = c0 + 4 + sec.art[0].length + 4 + 36 < c1;
  if (roomy) sec.art.forEach((l, i) => gtext(l, c0 + 4, 6 + i, 0));
  const sc = roomy ? c0 + 4 + sec.art[0].length + 4 : c0 + 4;
  if (!mission.ready) { gtext('> CONNECTING RADIO' + '.'.repeat(Math.floor(t * 4) % 4), sc, 6, 0); return; }
  let row = 6, rr = 13;
  for (const l of mission.lines) {
    const n = shown(l);
    if (l.kind === 'status') { if (n > 0) gtext(l.text.slice(0, n), sc, row, 0); row += 2; }
    if (l.kind === 'radio') {
      if (mission.skipped || mission.t >= l.start) {
        const talking = !mission.skipped && mission.t < l.start + l.dur + 0.2;
        gtext(talking && Math.floor(t * 6) % 2 ? 'CPU )))' : 'CPU    ', c0 + 4, rr, 1);   // the machine's own voice
        const max = c1 - (c0 + 15) - 2, txt = l.text.slice(0, n);
        if (l.text.length <= max) gtext(txt, c0 + 15, rr, 0);
        else {   // wrap long lines onto the spare row below
          const cut = l.text.lastIndexOf(' ', max);
          gtext(txt.slice(0, cut), c0 + 15, rr, 0);
          if (n > cut + 1) gtext(txt.slice(cut + 1), c0 + 15, rr + 1, 0);
        }
      }
      rr += 2;
    }
    if (l.kind === 'mission' && n > 0) gtext(l.text.slice(0, n), c0 + 4, 19, 1);
    if (l.kind === 'watch' && n > 0) gtext(l.text.slice(0, n), c0 + 4, 21, 0);
  }
  const rowRun = VROWS - 3;
  if (missionDone()) {
    const cmd = '> RUN SECTOR_' + pad(sec.id, 2) + (Math.floor(t * 2) % 2 ? '_' : ' ');
    gtext(cmd, c0 + 4, rowRun, 1);
    const tap = 'TAP TO RUN';
    gtext(tap, c1 - 4 - tap.length, rowRun, Math.floor(t * 2) % 2 ? 1 : 0);
  } else {
    const tap = 'TAP TO SKIP';
    gtext(tap, c1 - 4 - tap.length, rowRun, 0);
  }
}
function drawArtBox(art, items) {
  let r = drawArt(art, Math.floor(VROWS * 0.25));
  const s = items[0];
  gfill(center(s) - 2, r + 1, s.length + 4, 1); gtext(s, center(s), r + 1, Math.floor(t * 2) % 2 ? 1 : 0);
}
function drawRotate() {
  const lines = ['+--------+', '|        |  ->  +----------------+', '|  ROTATE|      |                |', '|  YOUR  |      |   LANDSCAPE    |', '|  PHONE |      |                |', '|        |      +----------------+', '+--------+'];
  ctx.save();
  const scale = 1;
  const cw = W / 40, chh = cw / 0.6;
  // draw with a temporary grid that fits portrait width
  const oCW = CW, oCH = CH; CW = cw; CH = chh;
  if (!atlas || atlas._cw !== cw) { buildAtlas(); atlas._cw = cw; }
  const r0 = Math.floor(H / chh / 2) - 4;
  lines.forEach((s, i) => gtext(s, 2, r0 + i, 0));
  CW = oCW; CH = oCH;
  ctx.restore();
}

// ---------- input ----------
const activePtr = new Map();
function cellAt(e) {
  const rect = cv.getBoundingClientRect();
  const x = (e.clientX - rect.left) * DPR, y = (e.clientY - rect.top) * DPR;
  return { col: x / CW, row: y / CH, x };
}
function menuActivate(i) {
  sfx('select');
  if (state === 'title') {
    const id = titleMenu()[i][0];
    if (id === 'start') startMission();
    else if (id === 'buttons') { swapButtons = !swapButtons; try { localStorage.setItem('lg_swap', swapButtons ? '1' : '0'); } catch (e) {} }
    else if (id === 'sound') { setSound(!AU.on); }
    else if (id === 'full') { toggleFull(); }
    else if (id === 'credits') { state = 'credits'; }
  } else if (state === 'credits') { state = 'title'; menuSel = 0; }
  else if (state === 'over' || state === 'win') { if (i === 0) newRun(); else toTitle(); }
}
function press(btn, down) {
  if (btn === 'jump') { if (down && !input.jump) input.jumpPressed = true; input.jump = down; }
  if (btn === 'shoot') { if (down && !input.shoot) input.shootPressed = true; input.shoot = down; }
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  audioUnlock();
  if ((state === 'title' || state === 'credits') && !AU.song) playSong('mission');
  if (H > W) return;
  if (state === 'mission') { missionTap(); return; }
  if (state === 'paused') { state = 'play'; last = performance.now(); return; }
  if (state === 'play') {
    const c = cellAt(e);
    const leftHalf = c.x < W / 2;
    const btn = (leftHalf !== swapButtons) ? 'jump' : 'shoot';
    activePtr.set(e.pointerId, btn); press(btn, true);
    return;
  }
  const c = cellAt(e);
  for (const m of menuHit) if (c.row >= m.row0 && c.row < m.row1 && c.col >= m.col0 && c.col < m.col1) { menuSel = m.i; menuActivate(m.i); return; }
});
function ptrUp(e) { const b = activePtr.get(e.pointerId); if (b) { activePtr.delete(e.pointerId); press(b, false); } }
cv.addEventListener('pointerup', ptrUp);
cv.addEventListener('pointercancel', ptrUp);
cv.addEventListener('contextmenu', e => e.preventDefault());

window.addEventListener('keydown', e => {
  if (e.repeat) return;
  const k = e.key;
  audioUnlock();
  if ((state === 'title' || state === 'credits') && !AU.song) playSong('mission');
  if (state === 'mission') { if (k === 'Enter' || k === ' ') missionTap(); return; }
  if (state === 'play') {
    if (k === ' ' || k === 'ArrowUp' || k === 'w' || k === 'z') press('jump', true);
    if (k === 'x' || k === 'f' || k === 'Enter' || k === 'ArrowRight') press('shoot', true);
    if (k === 'Escape' || k === 'p') state = 'paused';
    return;
  }
  if (state === 'paused') { state = 'play'; return; }
  const n = state === 'title' ? titleMenu().length : (state === 'credits' ? 1 : 2);
  if (k === 'ArrowDown') menuSel = (menuSel + 1) % n;
  if (k === 'ArrowUp') menuSel = (menuSel + n - 1) % n;
  if (k === 'Enter' || k === ' ') menuActivate(menuSel);
});
window.addEventListener('keyup', e => {
  const k = e.key;
  if (k === ' ' || k === 'ArrowUp' || k === 'w' || k === 'z') press('jump', false);
  if (k === 'x' || k === 'f' || k === 'Enter' || k === 'ArrowRight') press('shoot', false);
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden && state === 'play') state = 'paused';
  if (AU.ctx) { if (document.hidden) AU.ctx.suspend(); else AU.ctx.resume(); }
});

// ---------- loop ----------
let last = performance.now(), acc = 0, frozen = false;
function frame(now) {
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.1) dt = 0.1;
  if (!frozen && H <= W) { acc += dt; while (acc >= STEP) { update(STEP); acc -= STEP; } }
  render();
  requestAnimationFrame(frame);
}

async function boot() {
  try {
    const f1 = new FontFace('LG', `url(${FONT400})`, { weight: '400' });
    const f2 = new FontFace('LG', `url(${FONT700})`, { weight: '700' });
    document.fonts.add(await f1.load()); document.fonts.add(await f2.load());
  } catch (e) { /* fall back to system monospace */ }
  fontsReady = true;
  buildLevel();
  resize();
  requestAnimationFrame(frame);
}
boot();

// test hook (headless screenshots / auto-play)
window.__lg = {
  get S() { return { state, camX, P, lives: P.lives, objs: level.objs.length }; },
  hurtLog, newRun, startMission, missionTap, get mission() { return mission; }, AU, step(n) { for (let i = 0; i < n; i++) update(STEP); render(); },
  press, freeze(v) { frozen = v; }, setState(s) { state = s; }, render,
};
</script>
